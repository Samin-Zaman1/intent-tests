<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>try { const t = localStorage.getItem('office.theme'); if (t) document.documentElement.dataset.theme = JSON.parse(t); } catch {}</script>
<style>
/* ============ tokens ============ */
:root, [data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1014; --bg-2: #12151a; --surface: #171a20; --surface-2: #1c2027; --surface-3: #242934;
  --border: #23272f; --border-2: #2e333d; --text: #e7e9ee; --text-2: #a3aab7; --text-3: #6c7382;
  --accent: #7178ff; --accent-hover: #858bff; --on-accent: #ffffff; --accent-soft: rgba(113,120,255,.14); --accent-line: rgba(113,120,255,.45);
  --ok: #3dba84; --ok-soft: rgba(61,186,132,.14); --bad: #f26d6d; --bad-soft: rgba(242,109,109,.13);
  --warn: #e8a94e; --warn-soft: rgba(232,169,78,.13); --meet: #a98bfa; --meet-soft: rgba(169,139,250,.15);
  --code-bg: #0b0d11; --scroll: #2a2f39; --backdrop: rgba(5,6,9,.62);
  --shadow-pop: 0 16px 40px rgba(0,0,0,.5), 0 0 0 1px var(--border-2);
}
[data-theme="light"] {
  color-scheme: light;
  --bg: #f6f7f9; --bg-2: #eef0f4; --surface: #ffffff; --surface-2: #f3f4f7; --surface-3: #e8eaf0;
  --border: #e3e6ec; --border-2: #d5d9e1; --text: #171a21; --text-2: #555d6b; --text-3: #8a91a0;
  --accent: #5b62f0; --accent-hover: #4d54e6; --on-accent: #ffffff; --accent-soft: rgba(91,98,240,.1); --accent-line: rgba(91,98,240,.4);
  --ok: #1d9a64; --ok-soft: rgba(29,154,100,.1); --bad: #d64545; --bad-soft: rgba(214,69,69,.09);
  --warn: #b7791f; --warn-soft: rgba(183,121,31,.1); --meet: #7c5cdb; --meet-soft: rgba(124,92,219,.1);
  --code-bg: #f3f4f7; --scroll: #cfd3db; --backdrop: rgba(20,22,28,.35);
  --shadow-pop: 0 16px 40px rgba(20,22,28,.16), 0 0 0 1px var(--border);
}
:root { --r: 10px; --r-sm: 7px; --r-lg: 14px; --font: Inter, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; --mono: "JetBrains Mono", Consolas, "Cascadia Mono", monospace; }

/* ============ base ============ */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; display: grid; grid-template-rows: 56px auto 1fr; grid-template-columns: minmax(0, 1fr); overflow: hidden; font-feature-settings: "cv11", "ss01"; }
button, select, input, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; padding: 0; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
::selection { background: var(--accent-soft); }
* { scrollbar-width: thin; scrollbar-color: var(--scroll) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 10px; border: 3px solid transparent; background-clip: content-box; }
.i { flex: none; display: block; }
code, pre, kbd { font-family: var(--mono); }
kbd { font-size: 11px; border: 1px solid var(--border-2); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; color: var(--text-3); background: var(--surface); }

/* ============ controls ============ */
.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: var(--r-sm); border: 1px solid var(--border-2); background: var(--surface-2); color: var(--text); font-weight: 500; font-size: 13px; white-space: nowrap; transition: background .12s, border-color .12s, color .12s; }
.btn:hover:not(:disabled) { background: var(--surface-3); text-decoration: none; }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--on-accent); }
.btn.primary:hover:not(:disabled) { background: var(--accent-hover); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn.ghost:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
.btn.danger { color: var(--bad); }
.btn.danger:hover:not(:disabled) { background: var(--bad-soft); border-color: transparent; }
.btn.ok { color: var(--ok); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12px; border-radius: 6px; }
.icon-btn { width: 34px; height: 34px; border-radius: var(--r-sm); display: grid; place-items: center; color: var(--text-2); transition: background .12s, color .12s; position: relative; }
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn.on { color: var(--accent); }
select, input[type=text], input:not([type]), input[type=search], textarea { background: var(--surface); border: 1px solid var(--border-2); border-radius: var(--r-sm); padding: 0 10px; height: 32px; outline: none; transition: border-color .12s, box-shadow .12s; }
textarea { height: auto; padding: 8px 10px; line-height: 1.5; }
select:focus, input:focus, textarea:focus { border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-soft); }
.tag { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 500; background: var(--surface-3); color: var(--text-2); white-space: nowrap; }
.tag.accent { background: var(--accent-soft); color: var(--accent); }
.tag.ok { background: var(--ok-soft); color: var(--ok); } .tag.bad { background: var(--bad-soft); color: var(--bad); }
.tag.warn { background: var(--warn-soft); color: var(--warn); } .tag.meet { background: var(--meet-soft); color: var(--meet); }
.tag .pip { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.spin { animation: spin 1s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }

/* ============ top bar ============ */
.top { display: flex; align-items: center; gap: 14px; padding: 0 14px 0 12px; background: var(--bg-2); border-bottom: 1px solid var(--border); min-width: 0; }
.brand { display: flex; align-items: center; gap: 10px; flex: none; width: 230px; }
.logo { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 12px; letter-spacing: .02em; background: linear-gradient(135deg, #7178ff, #a98bfa); box-shadow: 0 4px 14px rgba(113,120,255,.35); }
.brand b { display: block; font-size: 14px; font-weight: 600; line-height: 1.2; }
.brand small { display: block; font-size: 11.5px; color: var(--text-3); line-height: 1.2; }
.searchbox { flex: 1; max-width: 460px; margin: 0 auto; position: relative; display: flex; align-items: center; }
.searchbox .i { position: absolute; left: 10px; color: var(--text-3); pointer-events: none; }
.searchbox input { width: 100%; height: 34px; padding-left: 34px; padding-right: 34px; background: var(--surface); border-color: var(--border); }
.searchbox kbd { position: absolute; right: 9px; }
.searchbox input:disabled { opacity: .5; }
.clock { display: flex; align-items: center; gap: 12px; flex: none; }
.sprint { display: grid; gap: 4px; min-width: 150px; }
.sprint .l1 { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--text-2); }
.sprint .l1 b { color: var(--text); font-weight: 600; }
.sprint .bar { height: 4px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
.sprint .bar span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--meet)); border-radius: 4px; }
.me { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 600; color: #fff; background: #0f8f7e; flex: none; }
.menu-btn { display: none; }
.notif-dot { position: absolute; top: 7px; right: 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }

/* ============ banner ============ */
.banner { display: flex; align-items: center; gap: 12px; padding: 8px 16px; font-size: 13px; border-bottom: 1px solid var(--border); background: var(--surface); }
.banner[hidden] { display: none; }
.banner .grow { flex: 1; color: var(--text-2); } .banner .grow b { color: var(--text); font-weight: 600; }
.banner .ico { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; flex: none; }
.banner.meet .ico { background: var(--meet-soft); color: var(--meet); }
.banner.meet { background: linear-gradient(90deg, var(--meet-soft), transparent 60%), var(--surface); }
.banner.info .ico { background: var(--warn-soft); color: var(--warn); }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--meet); box-shadow: 0 0 0 0 var(--meet); animation: pulse 1.8s infinite; flex: none; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(169,139,250,.6); } 70% { box-shadow: 0 0 0 8px rgba(169,139,250,0); } 100% { box-shadow: 0 0 0 0 rgba(169,139,250,0); } }

/* ============ layout ============ */
.app { display: grid; grid-template-columns: 68px 280px minmax(0, 1fr); min-height: 0; }
.app.wide { grid-template-columns: 68px minmax(0, 1fr); } .app.wide .side { display: none; }
.rail { background: var(--bg-2); display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 2px; border-right: 1px solid var(--border); }
.rail button { width: 56px; padding: 7px 0 6px; border-radius: 10px; font-size: 10.5px; font-weight: 500; color: var(--text-3); display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; transition: color .12s, background .12s; }
.rail button .i { width: 20px; height: 20px; }
.rail button:hover { color: var(--text); background: var(--surface); }
.rail button.on { color: var(--text); }
.rail button.on .ri { background: var(--accent-soft); color: var(--accent); }
.rail .ri { width: 36px; height: 28px; border-radius: 8px; display: grid; place-items: center; transition: background .12s; }
.rail .count { position: absolute; top: 2px; right: 6px; background: var(--accent); color: var(--on-accent); border-radius: 9px; font-size: 10px; min-width: 17px; height: 17px; padding: 0 4px; display: grid; place-items: center; font-weight: 600; border: 2px solid var(--bg-2); }
.rail .count.bad { background: var(--bad); }

.side { background: var(--bg-2); border-right: 1px solid var(--border); overflow-y: auto; padding: 10px 8px 24px; }
.side h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-3); margin: 18px 10px 6px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
.side h3:first-of-type { margin-top: 8px; }
.side h3 small { text-transform: none; letter-spacing: 0; font-weight: 500; }
.item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; color: var(--text-2); text-decoration: none !important; transition: background .1s, color .1s; }
.item:hover { background: var(--surface); color: var(--text); }
.item.on { background: var(--surface-2); color: var(--text); }
.item .meta { min-width: 0; flex: 1; }
.item .name { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13.5px; }
.item .name span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.item .time { color: var(--text-3); font-size: 11px; flex: none; }
.item .preview { color: var(--text-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item.unread .name span:first-child { color: var(--text); font-weight: 700; }
.item.unread .preview { color: var(--text-2); }
.chan-ico { width: 32px; height: 32px; border-radius: 9px; background: var(--surface-2); color: var(--text-2); display: grid; place-items: center; flex: none; }
.item.on .chan-ico { background: var(--accent-soft); color: var(--accent); }
.badge { background: var(--accent); color: var(--on-accent); border-radius: 10px; font-size: 10.5px; min-width: 18px; height: 18px; padding: 0 5px; display: grid; place-items: center; font-weight: 600; }
.doc-item { padding: 5px 10px; gap: 9px; font-size: 13px; }
.doc-item .label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.doc-item .i { color: var(--text-3); }
.doc-item.on .i { color: var(--accent); }
.dot-new { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
.pill { font-size: 10px; border-radius: 999px; padding: 1px 7px; background: var(--accent-soft); color: var(--accent); font-weight: 600; flex: none; }
.done { color: var(--ok); flex: none; display: flex; }
.empty-nav { color: var(--text-3); font-size: 12px; padding: 2px 10px 0; }

.avatar { width: 32px; height: 32px; border-radius: 50%; color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 600; flex: none; position: relative; letter-spacing: .01em; }
.avatar.lg { width: 36px; height: 36px; font-size: 13px; }
.avatar.sm { width: 24px; height: 24px; font-size: 10px; }
.avatar.xs { width: 20px; height: 20px; font-size: 9px; }
.avatar .dot { position: absolute; right: -1px; bottom: -1px; width: 11px; height: 11px; border-radius: 50%; background: var(--ok); border: 2.5px solid var(--bg-2); }
.dot.busy { background: var(--bad) !important; } .dot.meeting { background: var(--meet) !important; } .dot.out { background: var(--text-3) !important; }
.status-text { font-size: 12px; color: var(--text-3); }

/* ============ main ============ */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }
.head { flex: none; padding: 12px 22px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); background: var(--bg); }
.head .title { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
.head .title b { font-size: 15px; font-weight: 600; display: block; }
.head .topic { color: var(--text-3); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.feed { flex: 1; overflow-y: auto; padding: 10px 0 12px; min-height: 0; }
.day { color: var(--text-3); font-size: 11.5px; font-weight: 600; margin: 18px 22px 6px; display: flex; align-items: center; gap: 12px; }
.day::before, .day::after { content: ""; flex: 1; height: 1px; background: var(--border); }
.msg { display: flex; gap: 12px; padding: 6px 22px; transition: background .1s; }
.msg:hover { background: var(--surface); }
.msg.cont { padding-top: 1px; }
.msg.cont .avatar { visibility: hidden; height: 0; }
.msg .content { min-width: 0; flex: 1; max-width: 860px; }
.who { display: flex; align-items: baseline; gap: 8px; margin-bottom: 1px; }
.who b { font-weight: 600; font-size: 14px; }
.who .role { font-size: 11.5px; color: var(--text-3); }
.who time { font-size: 11.5px; color: var(--text-3); }
.msg.cont .who { display: none; }
.msg.mine .who b { color: #4fd1c0; }
.event { display: flex; gap: 12px; padding: 5px 22px; align-items: flex-start; }
.event:hover { background: var(--surface); }
.event .eico { width: 32px; display: flex; justify-content: center; flex: none; padding-top: 2px; }
.event .eico span { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; background: var(--surface-2); color: var(--text-2); }
.event.ok .eico span { background: var(--ok-soft); color: var(--ok); } .event.bad .eico span { background: var(--bad-soft); color: var(--bad); }
.event.warn .eico span { background: var(--warn-soft); color: var(--warn); } .event.meet .eico span { background: var(--meet-soft); color: var(--meet); }
.event.accent .eico span { background: var(--accent-soft); color: var(--accent); }
.event .ebody { flex: 1; min-width: 0; color: var(--text-2); font-size: 13px; max-width: 860px; }
.event .ebody b { color: var(--text); }
.event .ebody .src { color: var(--text-3); font-size: 11.5px; margin-left: 6px; }
.event.big .ebody { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 10px 14px; }
.event.turn .ebody { background: var(--accent-soft); border: 1px solid var(--accent-line); border-radius: var(--r); padding: 10px 14px; color: var(--text); }

/* ============ markdown ============ */
.md { overflow-wrap: anywhere; }
.md p { margin: 0 0 6px; } .md p:last-child { margin-bottom: 0; }
.md ul, .md ol { margin: 4px 0 6px; padding-left: 22px; }
.md li::marker { color: var(--text-3); }
.md code { background: var(--surface-3); border-radius: 5px; padding: 1px 5px; font-size: .86em; }
.md pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 12px 14px; overflow-x: auto; margin: 8px 0; line-height: 1.5; font-size: 12.5px; }
.md pre code { background: none; padding: 0; font-size: inherit; }
.md blockquote { margin: 8px 0; padding: 2px 14px; border-left: 3px solid var(--accent-line); color: var(--text-2); }
.md h1, .md h2, .md h3, .md h4 { font-size: 14.5px; margin: 10px 0 4px; font-weight: 600; }
.md hr { border: 0; border-top: 1px solid var(--border); margin: 14px 0; }
.md .tw { overflow-x: auto; margin: 8px 0; border: 1px solid var(--border); border-radius: var(--r-sm); }
.md table { border-collapse: collapse; font-size: 13px; width: 100%; }
.md th, .md td { padding: 7px 11px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--border); }
.md tr:last-child td { border-bottom: 0; }
.md th { background: var(--surface-2); font-weight: 600; color: var(--text-2); font-size: 12px; }
.md th, .md td { overflow-wrap: normal; word-break: normal; min-width: 90px; }
.md td code, .md th code { white-space: nowrap; }
.md a.ref { white-space: nowrap; font-weight: 600; font-family: var(--mono); font-size: .9em; background: var(--accent-soft); padding: 0 5px; border-radius: 5px; }
.md a.ref:hover { text-decoration: none; background: var(--accent-line); color: #fff; }
.md .box { display: inline-grid; place-items: center; width: 15px; height: 15px; border: 1.5px solid var(--border-2); border-radius: 4px; vertical-align: -2px; margin-right: 7px; }
.md .box.on { background: var(--accent); border-color: var(--accent); }
.md li.task { list-style: none; margin-left: -20px; }
.mention { color: var(--accent); font-weight: 600; background: var(--accent-soft); border-radius: 4px; padding: 0 3px; }
.mention.me { color: #fff; background: var(--accent); }
.changes { margin-top: 6px; font-size: 12px; color: var(--text-3); }
.changes summary { cursor: pointer; display: inline-flex; align-items: center; gap: 6px; list-style: none; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--border); }
.changes summary::-webkit-details-marker { display: none; }
.changes summary:hover { color: var(--text-2); border-color: var(--border-2); }
.changes .md { margin-top: 6px; padding: 8px 12px; border-left: 2px solid var(--border-2); }
.empty { color: var(--text-3); text-align: center; margin: 16vh auto 0; max-width: 360px; }
.empty .eic { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: var(--surface-2); color: var(--text-2); margin: 0 auto 14px; }
.empty b { color: var(--text); display: block; font-size: 15px; margin-bottom: 4px; font-weight: 600; }

.typing { flex: none; height: 22px; padding: 0 22px; color: var(--text-3); font-size: 12px; display: flex; align-items: center; gap: 8px; }
.dots { display: inline-flex; gap: 3px; } .dots span { width: 5px; height: 5px; border-radius: 50%; background: var(--text-3); animation: blink 1.2s infinite; }
.dots span:nth-child(2) { animation-delay: .2s; } .dots span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25 } 40% { opacity: 1 } }
.compose { flex: none; padding: 0 22px 18px; position: relative; }
.box-in { background: var(--surface); border: 1px solid var(--border-2); border-radius: var(--r-lg); padding: 10px 10px 10px 14px; display: flex; align-items: flex-end; gap: 8px; transition: border-color .12s, box-shadow .12s; }
.box-in:focus-within { border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-soft); }
.box-in textarea { flex: 1; resize: none; border: 0; outline: 0; background: transparent; max-height: 200px; min-height: 22px; padding: 4px 0; box-shadow: none !important; height: auto; }
.send { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); transition: background .12s, opacity .12s; flex: none; }
.send:hover:not(:disabled) { background: var(--accent-hover); }
.send:disabled { background: var(--surface-3); color: var(--text-3); cursor: default; }
.hint { font-size: 11.5px; color: var(--text-3); margin: 6px 4px 0; display: flex; gap: 12px; flex-wrap: wrap; }
.pop { position: absolute; bottom: calc(100% - 6px); left: 22px; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow-pop); min-width: 290px; padding: 5px; display: none; z-index: 3; }
.pop.show { display: block; }
.pop button { display: flex; gap: 10px; align-items: center; width: 100%; padding: 6px 8px; border-radius: 7px; text-align: left; }
.pop button.on, .pop button:hover { background: var(--surface-2); }
.pop small { color: var(--text-3); display: block; font-size: 11.5px; }

/* ============ pages ============ */
.page { flex: 1; overflow: auto; padding: 28px 32px 64px; min-height: 0; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.page-head h1 { font-size: 22px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
.page-head p { color: var(--text-2); margin: 4px 0 0; font-size: 13.5px; }
.section-title { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-3); font-weight: 600; margin: 32px 0 12px; display: flex; align-items: center; gap: 8px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 16px 18px; }
.notice { display: flex; gap: 12px; align-items: center; background: var(--warn-soft); color: var(--text); border: 1px solid rgba(232,169,78,.3); border-radius: var(--r); padding: 12px 14px; margin-bottom: 18px; max-width: 820px; }
.notice .i { color: var(--warn); }
.row-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.timeline { max-width: 820px; position: relative; display: grid; gap: 10px; }
.slot { display: grid; grid-template-columns: 64px 1fr auto; gap: 16px; align-items: center; padding: 14px 16px; }
.slot .t { font-family: var(--mono); font-size: 13px; color: var(--text-2); }
.slot .what b { display: block; font-weight: 600; font-size: 14.5px; }
.slot .what small { display: block; color: var(--text-3); font-size: 12.5px; margin-top: 2px; }
.slot .kind { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: var(--surface-2); color: var(--text-2); }
.slot .lead { display: flex; align-items: center; gap: 12px; }
.slot.done { opacity: .55; }
.slot select { max-width: 260px; }
.slot .row-actions { justify-content: flex-end; }
.slot.live { border-color: var(--meet); background: linear-gradient(90deg, var(--meet-soft), transparent 70%), var(--surface); }
.slot.live .kind { background: var(--meet-soft); color: var(--meet); }
.adhoc { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; max-width: 820px; }
.upcoming { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; max-width: 1060px; }
.upcoming .card { padding: 12px 14px; }
.upcoming .d { font-weight: 600; font-size: 13px; margin-bottom: 6px; display: flex; justify-content: space-between; }
.upcoming .d span { color: var(--text-3); font-weight: 500; }
.upcoming .m { color: var(--text-2); font-size: 12.5px; display: flex; gap: 8px; padding: 2px 0; }
.upcoming .m code { color: var(--text-3); font-size: 11.5px; }

.kanban { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 12px; align-items: flex-start; }
.col { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--r-lg); width: 248px; flex: none; padding: 10px; }
.col.qa { border-color: var(--accent-line); background: linear-gradient(180deg, var(--accent-soft), transparent 140px), var(--bg-2); }
.col h3 { margin: 2px 4px 10px; font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; color: var(--text); }
.col h3 .n { margin-left: auto; color: var(--text-3); font-weight: 500; font-size: 12px; }
.col h3 .sdot { width: 8px; height: 8px; border-radius: 50%; }
.col h3 .you { font-size: 10px; color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.tcard { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 11px 12px; margin-bottom: 8px; font-size: 13px; transition: border-color .12s, transform .12s; }
.tcard:hover { border-color: var(--border-2); }
.tcard .top-line { display: flex; justify-content: space-between; gap: 6px; align-items: center; margin-bottom: 6px; }
.tcard .id { font-family: var(--mono); font-weight: 500; font-size: 11.5px; color: var(--text-2); }
.tcard .ttl { margin-bottom: 10px; line-height: 1.4; font-weight: 500; }
.tcard .foot { display: flex; align-items: center; gap: 7px; color: var(--text-3); font-size: 12px; flex-wrap: wrap; }
.tcard .foot code { font-size: 11px; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
.tcard .acts { display: flex; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); flex-wrap: wrap; }
.col-empty { color: var(--text-3); font-size: 12px; padding: 14px 6px; text-align: center; border: 1px dashed var(--border-2); border-radius: var(--r); }
.table-wrap { border: 1px solid var(--border); border-radius: var(--r-lg); overflow: auto; max-width: 1160px; background: var(--surface); }
table.grid { border-collapse: collapse; width: 100%; font-size: 13px; }
table.grid th, table.grid td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: middle; }
table.grid tr:last-child td { border-bottom: 0; }
table.grid tbody tr:hover { background: var(--surface-2); }
table.grid th { font-size: 11.5px; color: var(--text-3); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; background: var(--bg-2); }
table.grid .mono { font-family: var(--mono); font-size: 12px; }
.owner { display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); }

.builds { display: grid; gap: 10px; max-width: 1060px; }
.build { display: grid; grid-template-columns: 36px 1fr auto; gap: 14px; align-items: center; padding: 14px 16px; }
.build .st { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); color: var(--text-2); }
.build .st.passed { background: var(--ok-soft); color: var(--ok); } .build .st.failed { background: var(--bad-soft); color: var(--bad); }
.build .st.running, .build .st.queued { background: var(--accent-soft); color: var(--accent); }
.build .br { font-weight: 600; font-family: var(--mono); font-size: 13px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.build .meta { color: var(--text-3); font-size: 12.5px; margin-top: 3px; display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: center; }
.build .meta code { color: var(--text-2); }
.build pre { grid-column: 1 / -1; max-height: 360px; overflow: auto; background: var(--code-bg); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 12px 14px; font-size: 12px; margin: 4px 0 0; white-space: pre-wrap; color: var(--text-2); }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; max-width: 1060px; margin-bottom: 8px; }
.stat { padding: 12px 14px; }
.stat .k { font-size: 11.5px; color: var(--text-3); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.stat .v { font-size: 22px; font-weight: 650; margin-top: 2px; letter-spacing: -.01em; }

/* ============ modal ============ */
.modal-bg { position: fixed; inset: 0; background: var(--backdrop); backdrop-filter: blur(4px); display: grid; place-items: center; z-index: 20; padding: 16px; animation: fade .12s ease-out; }
@keyframes fade { from { opacity: 0; } }
.modal { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-pop); width: 100%; max-width: 560px; max-height: calc(100vh - 32px); overflow: auto; animation: rise .16s ease-out; }
@keyframes rise { from { transform: translateY(8px); opacity: 0; } }
.modal.big { max-width: 1000px; }
.modal header { padding: 20px 22px 0; } .modal header h2 { margin: 0; font-size: 17px; font-weight: 600; } .modal header p { margin: 4px 0 0; color: var(--text-2); font-size: 13px; }
.modal .body { padding: 16px 22px; display: grid; gap: 14px; color: var(--text-2); }
.modal .body p { margin: 0; }
.modal footer { padding: 14px 22px 18px; display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid var(--border); }
.bugform { display: grid; grid-template-columns: 1fr 280px; gap: 22px; color: var(--text); }
.field { display: grid; gap: 6px; }
.field label { font-size: 12.5px; font-weight: 600; color: var(--text); }
.field small { color: var(--text-3); font-size: 11.5px; }
.field input, .field select, .field textarea { width: 100%; }
.field textarea { resize: vertical; min-height: 70px; }
.field textarea.mono { font-family: var(--mono); font-size: 12.5px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.sev { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.sev label { border: 1px solid var(--border-2); border-radius: var(--r-sm); padding: 7px 8px; cursor: pointer; font-weight: 500; font-size: 12.5px; text-align: center; color: var(--text-2); transition: all .12s; }
.sev label small { display: block; font-size: 10.5px; color: var(--text-3); font-weight: 400; }
.sev input { display: none; }
.sev label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
.rubric { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--r); padding: 14px 16px; font-size: 12.5px; align-self: start; position: sticky; top: 0; color: var(--text-2); }
.rubric b { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; color: var(--text); font-size: 13px; }
.rubric ol { margin: 0; padding-left: 18px; } .rubric li { margin: 5px 0; } .rubric li::marker { color: var(--text-3); }
.rubric p { margin: 12px 0 0; padding-top: 10px; border-top: 1px solid var(--border); }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--surface-3); color: var(--text); padding: 10px 16px; border-radius: var(--r); z-index: 30; box-shadow: var(--shadow-pop); max-width: 90vw; font-size: 13px; animation: rise .16s ease-out; display: flex; gap: 8px; align-items: center; }

/* ============ reader ============ */
.reader { display: flex; gap: 40px; justify-content: center; padding: 36px 32px 80px; align-items: flex-start; }
.article { width: 100%; max-width: 780px; font-size: 15px; line-height: 1.75; color: var(--text-2); }
.article .crumbs { font-size: 12.5px; color: var(--text-3); margin-bottom: 18px; display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: space-between; align-items: center; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
.article .crumbs .path { display: inline-flex; align-items: center; gap: 6px; }
.article .crumbs .acts { display: inline-flex; gap: 6px; align-items: center; }
.article .fresh { color: var(--ok); font-weight: 600; }
.article h1 { font-size: 28px; line-height: 1.25; margin: 4px 0 16px; color: var(--text); font-weight: 700; letter-spacing: -.015em; }
.article h2 { font-size: 19px; line-height: 1.35; margin: 36px 0 10px; color: var(--text); font-weight: 650; letter-spacing: -.01em; }
.article h3 { font-size: 16px; margin: 26px 0 6px; color: var(--text); font-weight: 600; }
.article h4 { font-size: 15px; margin: 20px 0 4px; color: var(--text); }
.article b { color: var(--text); font-weight: 600; }
.article p { margin: 0 0 14px; }
.article ul, .article ol { margin: 0 0 16px; padding-left: 24px; }
.article li { margin: 5px 0; }
.article .tw { margin: 14px 0 18px; }
.article table { font-size: 13.5px; }
.article th, .article td { padding: 9px 13px; }
.article td { color: var(--text-2); }
.article pre { font-size: 13px; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 44px; }
.pager a { border: 1px solid var(--border); border-radius: var(--r); padding: 12px 16px; color: var(--text); line-height: 1.4; background: var(--surface); transition: border-color .12s; }
.pager a:hover { border-color: var(--accent-line); text-decoration: none; }
.pager a small { display: block; color: var(--text-3); font-size: 12px; margin-bottom: 2px; }
.pager a.next { text-align: right; grid-column: 2; }
.toc { position: sticky; top: 0; width: 210px; flex: none; font-size: 13px; padding-top: 6px; }
.toc b { display: block; font-size: 11px; text-transform: uppercase; color: var(--text-3); letter-spacing: .07em; margin-bottom: 10px; font-weight: 600; }
.toc a { display: block; color: var(--text-3); padding: 4px 0 4px 12px; border-left: 1px solid var(--border-2); }
.toc a:hover { color: var(--text); border-color: var(--accent); text-decoration: none; }
@media (max-width: 1250px) { .toc { display: none; } }

/* ============ responsive ============ */
.mobile-tabs { display: none; }
@media (max-width: 1000px) { .brand { width: auto; } .brand .txt { display: none; } .sprint { display: none; } .bugform { grid-template-columns: 1fr; } .rubric { position: static; } }
@media (max-width: 760px) {
  body { grid-template-rows: 52px auto 1fr; }
  .app, .app.wide { grid-template-columns: minmax(0, 1fr); }
  .me, #bell { display: none; }
  .top { gap: 8px; padding: 0 10px; }
  .clock .btn { padding: 0 10px; }
  .app.wide .side { display: block; }
  .rail { display: none; }
  .side { position: fixed; top: 52px; bottom: 0; left: 0; width: 86vw; max-width: 320px; z-index: 5; transform: translateX(-100%); transition: transform .2s; box-shadow: var(--shadow-pop); }
  .side.open { transform: none; }
  .menu-btn { display: grid; }
  .searchbox { display: none; }
  .clock { margin-left: auto; }
  .msg, .event { padding-left: 14px; padding-right: 14px; }
  .compose { padding: 0 12px 12px; } .typing { padding: 0 16px; }
  .head { padding: 10px 14px; }
  .page { padding: 18px 16px 48px; }
  .reader { padding: 20px 16px 48px; }
  .pager { grid-template-columns: 1fr; } .pager a.next { grid-column: 1; }
  .two { grid-template-columns: 1fr; } .sev { grid-template-columns: repeat(2, 1fr); }
  .slot { grid-template-columns: 1fr; gap: 10px; }
  .mobile-tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 0 0 8px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
  .mobile-tabs button { padding: 7px 2px; border-radius: 8px; font-size: 11.5px; color: var(--text-2); }
  .mobile-tabs button.on { background: var(--surface-2); color: var(--text); font-weight: 600; }
}
</style>
</head>
<body>
<header class="top">
  <button class="icon-btn menu-btn" id="menu" aria-label="Show menu"><svg class="i" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <div class="brand"><span class="logo">IT</span><span class="txt"><b>Intent Tests</b><small>Team Office</small></span></div>
  <label class="searchbox"><svg class="i" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="search" type="search" aria-label="Search"><kbd>/</kbd></label>
  <div class="clock" id="clock"></div>
  <button class="icon-btn" id="theme" title="Switch theme"></button>
  <button class="icon-btn" id="bell" title="Desktop notifications"></button>
  <span class="me" title="Samin Zaman (you), QA Engineer">SZ</span>
</header>
<div class="banner" id="banner" hidden></div>
<div class="app" id="app">
  <nav class="rail" id="rail" aria-label="Apps"></nav>
  <aside class="side" id="side"></aside>
  <main class="main">
    <div class="head" id="head"></div>
    <div class="feed" id="feed"></div>
    <div class="typing" id="typing"></div>
    <div class="compose" id="compose">
      <div class="pop" id="pop"></div>
      <div class="box-in">
        <textarea id="input" rows="1" placeholder="Type a message"></textarea>
        <button class="send" id="send" title="Send (Enter)" aria-label="Send"><svg class="i" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </div>
      <div class="hint" id="hint"></div>
    </div>
  </main>
</div>
<div id="modal-root"></div>
<script src="/app.js"></script>
</body>
</html>
